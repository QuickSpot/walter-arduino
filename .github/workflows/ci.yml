name: CI

# Two stages: the checks, then the example build, which starts only when the checks passed.

# Documentation alone runs nothing. Run the workflow by hand to build again.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # src/bluecherry/ is bluecherry-lite-sdk's. It reaches this repository only through
      # walter-esp-idf: the SDK's CI updates a pull request there, and the src sync brings it here
      # once merged.
      - name: src/bluecherry/ only changes through the bluecherry-lite-sdk sync
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -q '^src/bluecherry/'; then
            echo "::error::src/bluecherry/ is copied from bluecherry-lite-sdk. Change it there; it arrives here through walter-esp-idf."
            exit 1
          fi

      # Pinned: clang-format releases lay some code out differently. The examples are not checked
      # yet; mqtt and mqtts are not formatted.
      - name: Formatting of src/ (clang-format 22.1.8)
        run: >
          find src \( -name '*.c' -o -name '*.h' -o -name '*.cpp' \) -print0
          | xargs -0 pipx run --spec clang-format==22.1.8 clang-format --dry-run --Werror

  # Everything is compiled in on Arduino, so this builds every protocol together. walter-esp-idf
  # covers the opposite: each example with only its own.
  arduino:
    name: "Arduino: build the examples (Walter)"
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Every sketch in examples/
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:walter
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
